<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2c"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="朝のニュース"><title>朝のニュース</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#192438;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:22px 16px 90px}header{background:#101a2c;color:white;padding:28px 18px 25px}header .inner{max-width:760px;margin:auto}h1{margin:4px 0 8px;font-size:28px}.muted{color:#647084}.headmuted{color:#b9c5d7;font-size:13px}.stats{display:flex;gap:10px;margin:18px 0}.stat{flex:1;background:white;border-radius:13px;padding:14px;text-align:center;box-shadow:0 1px 5px #15223a10}.stat b{display:block;font-size:24px}.stat small{color:#667}.toolbar{display:flex;gap:8px;overflow-x:auto;padding:5px 0 15px}button,select{font:inherit}button{cursor:pointer}.chip{white-space:nowrap;border:1px solid #d8deea;background:white;border-radius:22px;padding:9px 14px}.chip.active{background:#14233b;color:white;border-color:#14233b}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.actions select,.actions button{border:1px solid #d9dfeb;background:white;border-radius:9px;padding:10px}.item{background:white;border-radius:14px;margin:10px 0;padding:17px;box-shadow:0 1px 5px #15223a12}.item h2{font-size:17px;line-height:1.55;margin:9px 0}.meta{color:#66738a;font-size:12px}.item p{font-size:14px;line-height:1.7;color:#3f4d62}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;background:#eaf0f8;padding:5px 8px;border-radius:7px}.read{opacity:.68}.item .buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.item button{border:1px solid #d7deea;background:#fff;padding:9px 12px;border-radius:9px}.item .primary{background:#14233b;color:white}.empty{padding:45px 15px;text-align:center;color:#647084}.notice{font-size:13px;line-height:1.7;color:#53647b;background:#e9eef6;padding:13px;border-radius:11px;margin:14px 0}.resume{width:100%;border:0;background:#2563eb;color:white;border-radius:12px;padding:14px;font-weight:700;margin:4px 0 16px}a{color:#1955b6}#detail{display:none;position:fixed;inset:0;background:#f4f6fa;overflow-y:auto;z-index:4}#detail .article{max-width:760px;margin:auto;padding:20px 18px 100px;line-height:1.9}#detail h2{line-height:1.55}#detail .sticky{position:sticky;top:0;background:#fff;border-bottom:1px solid #e1e5ed;padding:12px;display:flex;justify-content:space-between}#detail button{border:0;background:#e9eef6;padding:10px 13px;border-radius:8px}.foot{font-size:12px;color:#66738a;margin-top:28px}
</style></head><body><header><div class="inner"><div class="headmuted">MORNING BUSINESS READER</div><h1>朝のニュース</h1><div class="headmuted">5分でチェックする、今日の重要ニュース</div></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="total">0</b><small>記事数</small></div><div class="stat"><b id="unread">0</b><small>未読</small></div><div class="stat"><b id="saved">0</b><small>保存済み</small></div></div><div id="notice" class="notice">記事データを読み込んでいます。</div><button id="resume" class="resume" hidden>▶ 前回の続きから読む</button><div class="actions"><select id="date"><option value="all">すべての日付</option></select><select id="mode"><option value="unread" selected>未読のみ</option><option value="all">すべて</option><option value="saved">お気に入り</option></select></div><div class="toolbar" id="categories"></div><section id="list"></section><div class="foot">既読・お気に入り・閲覧位置はこの端末のブラウザーに保存されます。端末やブラウザーを変更すると引き継がれません。ニュース本文は配信元へのリンクから確認してください。</div></main><div id="detail"><div class="sticky"><button id="back">← 一覧へ</button><button id="star">☆ 保存</button></div><article class="article" id="article"></article></div><script>
const $=id=>document.getElementById(id);let articles=[],category='すべて',current=null;const key='morning-news-reader-v1';let state={read:{},saved:{},progress:{},last:null};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};const persist=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let dates=[...new Set(articles.map(a=>a.date))].sort().reverse();const old=$('date').value;$('date').innerHTML='<option value="all">すべての日付</option>'+dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');$('date').value=dates.includes(old)?old:'all';$('total').textContent=articles.length;$('unread').textContent=articles.filter(a=>!state.read[a.id]).length;$('saved').textContent=articles.filter(a=>state.saved[a.id]).length;let cats=['すべて','日経平均','不動産','世界情勢','金融市場','ファッション'];$('categories').innerHTML=cats.map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderList();renderCats()});renderList();$('resume').hidden=!state.last||!articles.some(a=>a.id===state.last)}
function renderCats(){document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===category))}
function renderList(){let rows=articles.filter(a=>(category==='すべて'||a.category===category)&&($('date').value==='all'||a.date===$('date').value)&&($('mode').value==='all'||($('mode').value==='unread'&&!state.read[a.id])||($('mode').value==='saved'&&state.saved[a.id])));$('list').innerHTML=rows.length?rows.map(a=>`<div class="item ${state.read[a.id]?'read':''}"><div class="row"><span class="tag">${esc(a.category)}</span><span class="meta">${esc(a.date)} ${state.read[a.id]?'✓ 既読':'● 未読'}</span></div><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><div class="buttons"><button class="primary" data-open="${esc(a.id)}">記事を読む</button><button data-save="${esc(a.id)}">${state.saved[a.id]?'★ 保存済み':'☆ 保存'}</button></div></div>`).join(''):'<div class="empty">該当する記事はありません。</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openArticle(b.dataset.open));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{state.saved[b.dataset.save]=!state.saved[b.dataset.save];persist();render()})}
function openArticle(id){const a=articles.find(x=>x.id===id);if(!a)return;current=id;state.last=id;state.read[id]=true;persist();$('article').innerHTML=`<div class="meta">${esc(a.date)} ｜ ${esc(a.category)}</div><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><p><b>注目ポイント</b></p><p>${esc(a.impact||'記事の詳細と影響は情報源で確認してください。')}</p><p><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">元の記事を開く ↗</a></p><p class="meta">情報源：${esc(a.source||'ニュース配信元')} ／ 公開：${esc(a.published||'')}</p>`;$('detail').style.display='block';$('star').textContent=state.saved[id]?'★ 保存済み':'☆ 保存';$('detail').scrollTop=state.progress[id]||0;render()}
function closeArticle(){if(current){state.progress[current]=$('detail').scrollTop;persist()}$('detail').style.display='none';current=null;render()};$('back').onclick=closeArticle;$('star').onclick=()=>{if(!current)return;state.saved[current]=!state.saved[current];persist();$('star').textContent=state.saved[current]?'★ 保存済み':'☆ 保存';render()};$('detail').addEventListener('scroll',()=>{if(current){state.progress[current]=$('detail').scrollTop;persist()}},{passive:true});$('resume').onclick=()=>openArticle(state.last);$('date').onchange=renderList;$('mode').onchange=renderList;
(async()=>{try{const response=await fetch('./data/news.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('データがありません');const payload=await response.json();articles=(payload.articles||[]).sort((a,b)=>(b.date+b.published).localeCompare(a.date+a.published));$('notice').textContent=`最終更新：${payload.updated_at||'不明'}（日本時間）。記事はニュース配信元の見出し・要約をもとに収集しています。AIによる独自の深掘り解説ではありません。`;render()}catch(e){$('notice').textContent='まだ記事データがありません。公開後に自動更新が実行されると記事が表示されます。';render()}})();
</script></body></html>
