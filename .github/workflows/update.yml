name: 朝のニュース自動更新
on:
  schedule:
    # 09:00 JST = 00:00 UTC; GitHub Actions may start late.
    - cron: '0 0 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 運行情報を確認
        run: python update_status.py
      - name: RSSから記事を取得
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        run: python update_news.py
      - name: 取得結果を保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update morning news'
            git push
          fi
